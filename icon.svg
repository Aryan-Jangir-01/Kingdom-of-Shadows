<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="60%" stop-color="#190c2e"/>
      <stop offset="100%" stop-color="#07040d"/>
    </radialGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Outer Celestial Rune Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#9333ea" stroke-width="4" opacity="0.6"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="16 10"/>

  <!-- Divine Aura Shield Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#shieldGlow)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.85"/>

  <!-- Golden Holy Sword -->
  <g filter="url(#glow)">
    <!-- Blade Tip & Body -->
    <path d="M 256 70 L 278 120 L 274 330 L 238 330 L 234 120 Z" fill="url(#bladeGrad)"/>
    <path d="M 256 70 L 256 330" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    
    <!-- Crossguard -->
    <path d="M 170 330 Q 256 350 342 330 Q 346 345 330 352 Q 256 364 182 352 Q 166 345 170 330 Z" fill="#f59e0b"/>
    <!-- Guard Gem -->
    <circle cx="256" cy="342" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

    <!-- Grip / Hilt -->
    <rect x="248" y="354" width="16" height="60" rx="4" fill="#78350f"/>
    <line x1="248" y1="368" x2="264" y2="368" stroke="#fbbf24" stroke-width="2"/>
    <line x1="248" y1="386" x2="264" y2="386" stroke="#fbbf24" stroke-width="2"/>
    <line x1="248" y1="402" x2="264" y2="402" stroke="#fbbf24" stroke-width="2"/>

    <!-- Pommel -->
    <circle cx="256" cy="426" r="18" fill="#f59e0b" stroke="#fef08a" stroke-width="3"/>
    <circle cx="256" cy="426" r="6" fill="#fbbf24"/>
  </g>

  <!-- Electric Sparks -->
  <circle cx="150" cy="180" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="360" cy="190" r="6" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="170" cy="280" r="4" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="340" cy="270" r="5" fill="#38bdf8" filter="url(#glow)"/>
</svg>
